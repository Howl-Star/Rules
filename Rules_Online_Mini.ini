# 📺 影音媒体
ruleset=📺 影音媒体,[]DOMAIN-SUFFIX,emby.blog
ruleset=📺 影音媒体,[]DOMAIN-SUFFIX,1024.name
ruleset=📺 影音媒体,[]DOMAIN-SUFFIX,embyplus.org

# 📱 抖音 & 字节跳动
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/DouYin/DouYin.list

ruleset=🐟 漏网之鱼,[]FINAL

custom_proxy_group=🚀 节点选择`select`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=📺 影音媒体`select`🇺🇸.*`.*Emby.*
custom_proxy_group=💬 AI大模型`select`🇺🇸.*
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`.*

enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=https://raw.githubusercontent.com/Howl-Star/Rules/refs/heads/Default/clashdns.yml
