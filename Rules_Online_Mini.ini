[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;去广告：支持
;自动测速：支持
;微软分流：不支持
;苹果分流：不支持
;增强中国IP段：不支持
;增强国外GFW：不支持

# 💬 AI大模型
ruleset=💬 AI大模型,[]DOMAIN-SUFFIX,x.ai
ruleset=💬 AI大模型,[]DOMAIN-SUFFIX,grok.com
ruleset=💬 AI大模型,https://raw.githubusercontent.com/Howl-Star/Rules/refs/heads/Default/chatgpt.list
ruleset=💬 AI大模型,https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/rule/openai.list

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
